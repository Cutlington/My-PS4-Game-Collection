<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My PS4 Game Library</title>
<style>
  :root {
    --bg: #f4f5f8; --surface: #ffffff; --surface2: #eceef3; --text: #15171c;
    --muted: #5d6472; --border: #d9dce4; --accent: #2563eb; --accent-text: #ffffff;
    --shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1015; --surface: #181b22; --surface2: #222632; --text: #e8eaf0;
      --muted: #9aa1b2; --border: #2c3140; --accent: #4f8cff; --accent-text: #0b0d12;
      --shadow: 0 2px 14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1015; --surface: #181b22; --surface2: #222632; --text: #e8eaf0;
    --muted: #9aa1b2; --border: #2c3140; --accent: #4f8cff; --accent-text: #0b0d12;
    --shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 20px 16px; }
  .top { max-width: 1400px; margin: 0 auto 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  h1 { margin: 0; text-align: center; font-size: 1.7rem; font-weight: 800; letter-spacing: .22em;
    text-transform: uppercase; }
  #theme { justify-self: end; height: 38px; padding: 0 14px; }
  .searchrow { position: relative; max-width: 640px; margin: 0 auto 16px; }
  .searchrow::before { content: "🔍"; position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    font-size: .95rem; opacity: .6; pointer-events: none; }
  input[type=search] { width: 100%; height: 46px; border-radius: 999px; padding: 0 20px 0 46px;
    font: inherit; font-size: 1rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 8px 12px; }
  button:hover { border-color: var(--accent); }
  .quick { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .qbadge { padding: 5px 14px; font-size: .82rem; font-weight: 500; border-radius: 999px;
    background: transparent; color: var(--muted); }
  .qbadge:hover { color: var(--text); }
  .qbadge.more { border-style: dashed; }
  .qbadge.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .qsep { flex: 0 0 1px; align-self: stretch; margin: 2px 4px; background: var(--border); }
  .chips { max-width: 1400px; margin: 14px auto 0; padding-top: 14px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chips.collapsed { display: none; }
  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
  .toolbar .in { max-width: 1440px; margin: 0 auto; padding: 10px 20px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px; }
  #count { font-weight: 700; font-size: .95rem; }
  .sortbox { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  select { height: 36px; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 10px; font: inherit; }
  .chip { padding: 4px 11px; font-size: .82rem; border-radius: 999px; background: var(--surface2); }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  main { max-width: 1440px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; gap: 16px; align-items: stretch; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: var(--shadow); cursor: pointer; text-align: left; padding: 0;
    display: grid; grid-row: span 5; grid-template-rows: subgrid; row-gap: 0; transition: transform .12s; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: var(--surface2); display: block; }
  .card .meta { padding: 0 12px; align-self: start; }
  .card .tags { margin: 0; padding: 8px 12px 12px; align-self: end; align-content: flex-end; }
  .card { position: relative; }
  .dlc-row { padding: 6px 12px 0; align-self: start; }
  .dlc-row:empty { padding: 0; }
  .dlc-badge { display: inline-block; background: var(--accent); color: var(--accent-text);
    font-size: .76rem; font-weight: 800; letter-spacing: .06em; line-height: 1.4;
    padding: 2px 11px; border-radius: 999px; }
  .dlc-list { margin: 8px 0 0; padding-left: 20px; }
  .dlc-list li { margin: 3px 0; }
  .card h3 { margin: 0; padding: 10px 12px 2px; font-size: .95rem; line-height: 1.3; align-self: start; }
  .meta { color: var(--muted); font-size: .78rem; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: .7rem; padding: 1px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
  .empty, .error { text-align: center; color: var(--muted); padding: 60px 20px; }
  .error { color: #d33; }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
    color: var(--text); padding: 0; width: min(760px, 94vw); max-height: 90vh; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .modal { display: grid; grid-template-columns: 240px 1fr; gap: 20px; padding: 20px; }
  .modal img { width: 100%; border-radius: 10px; background: var(--surface2); }
  .modal h2 { margin: 0 0 4px; }
  .modal p { margin: 10px 0; }
  .modal h4 { margin: 14px 0 4px; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .close { position: absolute; top: 10px; right: 10px; }
  @media (max-width: 700px) {
    header { padding: 14px 14px 12px; }
    .top { display: block; position: relative; margin-bottom: 12px; }
    h1 { font-size: 1rem; letter-spacing: .12em; padding: 0 44px; }
    #theme { position: absolute; right: 0; top: 50%; transform: translateY(-50%); padding: 0 10px; }
    #theme .tl { display: none; }
    .searchrow { margin-bottom: 12px; }
    .quick, .chips { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
    .quick::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
    .qbadge, .chip { flex: 0 0 auto; white-space: nowrap; }
    .toolbar .in { padding: 8px 14px; }
    main { padding: 14px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  }
  @media (max-width: 600px) { .modal { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <span></span>
    <h1>My PS4 Game Library</h1>
    <button id="theme" title="Switch light/dark theme"></button>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Search games…" aria-label="Search games">
  </div>
  <nav class="quick" id="quick" aria-label="Quick genre filters"></nav>
  <div class="chips collapsed" id="chips"></div>
</header>
<div class="toolbar">
  <div class="in">
    <span id="count" aria-live="polite"></span>
    <label class="sortbox">Filter: <select id="sort" aria-label="Filter by first letter">
      <option value="all">All games</option>
    </select></label>
  </div>
</div>
<main>
  <div id="grid" class="grid"></div>
  <div id="msg"></div>
</main>

<dialog id="dlg">
  <button class="close" id="closeBtn" aria-label="Close">✕</button>
  <div class="modal" id="modal"></div>
</dialog>

<script>
(function () {
  var DATA_FILE = 'games.json';
  var games = [], activeGenres = new Set(), activePlatforms = new Set(), genreCounts = {};
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var QUICK = [
    ['Adventure', 'Adventure'], ['Shooter', 'Shooter'], ['Racing', 'Racing'],
    ['Role-playing (RPG)', 'RPG'], ['Puzzle', 'Puzzle'], ['Platform', 'Platformer'],
    ['Sport', 'Sports'], ['Fighting', 'Fighting'], ['Strategy', 'Strategy']
  ];
  var PLATFORMS = ['PSP', 'PS2', 'PS1'];
  $('quick').innerHTML = QUICK.map(function (p) {
    return '<button class="qbadge" data-g="' + esc(p[0]) + '">' + esc(p[1]) + '</button>';
  }).join('') + '<span class="qsep" aria-hidden="true"></span>' + PLATFORMS.map(function (p) {
    return '<button class="qbadge" data-p="' + p + '">' + p + '</button>';
  }).join('');

  var moreBtn = document.createElement('button');
  moreBtn.className = 'qbadge more';
  $('quick').appendChild(moreBtn);
  function updateMore() {
    var open = !$('chips').classList.contains('collapsed');
    var extra = 0;
    activeGenres.forEach(function (g) { if (!QUICK.some(function (p) { return p[0] === g; })) extra++; });
    moreBtn.textContent = 'More genres' + (extra && !open ? ' (' + extra + ')' : '') + (open ? ' ▴' : ' ▾');
  }
  moreBtn.addEventListener('click', function () {
    $('chips').classList.toggle('collapsed');
    updateMore();
  });

  function syncBadges() {
    document.querySelectorAll('.chip, .qbadge').forEach(function (b) {
      if (b.dataset.g) b.classList.toggle('on', activeGenres.has(b.dataset.g));
      if (b.dataset.p) b.classList.toggle('on', activePlatforms.has(b.dataset.p));
    });
    updateMore();
  }
  function toggleGenre(e) {
    var b = e.target.closest('.chip, .qbadge'); if (!b) return;
    var x = b.dataset.g;
    if (activeGenres.has(x)) activeGenres.delete(x); else activeGenres.add(x);
    syncBadges();
    render();
  }

  function togglePlatform(p) {
    if (activePlatforms.has(p)) activePlatforms.delete(p); else activePlatforms.add(p);
    syncBadges();
    render();
  }

  function dlcNames(g) {
    return (Array.isArray(g.dlc) ? g.dlc : []).map(function (d) {
      return typeof d === 'string' ? d : (d && (d.name || d.title)) || '';
    }).filter(Boolean);
  }
  function hasDlc(g) { return dlcNames(g).length > 0; }

  // Up to 3 genres per card: the ones in the quick-badge bar first (so they match the
  // buttons at the top), rarest first; an optional "main_genres" list on a game overrides this.
  function cardGenres(g) {
    var all = g.genres || [];
    var quick = QUICK.map(function (p) { return p[0]; });
    var picked = (Array.isArray(g.main_genres) ? g.main_genres : []).filter(function (x) { return all.indexOf(x) >= 0; });
    var byRarity = function (a, b) { return (genreCounts[a] || 0) - (genreCounts[b] || 0); };
    var rest = all.filter(function (x) { return picked.indexOf(x) < 0; });
    var q = rest.filter(function (x) { return quick.indexOf(x) >= 0; }).sort(byRarity);
    var o = rest.filter(function (x) { return quick.indexOf(x) < 0; }).sort(byRarity);
    return picked.concat(q, o).slice(0, 3);
  }

  // Which console a game really came from, worked out from its Title ID.
  // CUSA = PS4. PSP discs start with U (ULUS, UCES...). PS1 and PS2 share the SLUS/SCUS/SLES/SCES
  // prefixes (the letters only say US or Europe), so the number decides: US numbers below 20000
  // and EU numbers below 50000 are PS1, anything above is PS2. Anything else (homebrew etc.) is ''.
  function platformOf(g) {
    var m = (g.titleID || '').toUpperCase().match(/^([A-Z]{4})(\d+)$/);
    if (!m) return '';
    var p = m[1], n = parseInt(m[2], 10);
    if (/^U[LC][UEJAK][SA]$/.test(p)) return 'PSP';
    if (p === 'SLUS' || p === 'SCUS') return n < 20000 ? 'PS1' : 'PS2';
    if (p === 'SLES' || p === 'SCES') return n < 50000 ? 'PS1' : 'PS2';
    return '';
  }

  function letterOf(name) {
    var c = (name || '').trim().charAt(0).normalize('NFD').charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }

  function buildSortBox() {
    var present = {};
    games.forEach(function (g) { present[letterOf(g.name)] = true; });
    var letters = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    var keep = $('sort').value || 'all';
    var html = '<option value="all">All games</option>' +
      '<optgroup label="Starts with…">' +
      letters.map(function (L) {
        return '<option value="L:' + L + '"' + (!games.length || present[L] ? '' : ' disabled') + '>' +
          (L === '#' ? '0–9 / symbols' : L) + '</option>';
      }).join('') + '</optgroup>';
    $('sort').innerHTML = html;
    $('sort').value = keep;
  }

  function init(list) {
    games = list.map(function (g, i) { g._i = i; return g; });
    var counts = genreCounts = {};
    games.forEach(function (g) { (g.genres || []).forEach(function (x) { counts[x] = (counts[x] || 0) + 1; }); });
    $('chips').innerHTML = Object.keys(counts).sort().map(function (x) {
      return '<button class="chip" data-g="' + esc(x) + '">' + esc(x) + ' (' + counts[x] + ')</button>';
    }).join('');
    buildSortBox();
    render();
  }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var s = $('sort').value;
    var letter = s.indexOf('L:') === 0 ? s.slice(2) : null;
    var out = games.filter(function (g) {
      if (letter && letterOf(g.name) !== letter) return false;
      if (activePlatforms.size && !activePlatforms.has(platformOf(g))) return false;
      if (q && (g.name || '').toLowerCase().indexOf(q) < 0 && (g.titleID || '').toLowerCase().indexOf(q) < 0) return false;
      var gs = g.genres || [];
      var ok = true;
      activeGenres.forEach(function (x) { if (gs.indexOf(x) < 0) ok = false; });
      return ok;
    });
    out.sort(function (a, b) {
      var r = (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base', numeric: true });
      return r;
    });
    $('count').textContent = out.length === games.length
      ? games.length + ' games'
      : out.length + ' of ' + games.length + ' games';
    $('grid').innerHTML = out.map(function (g) {
      return '<button class="card" data-i="' + g._i + '">' +
        '<img loading="lazy" src="' + esc(g.image_url_medium) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<h3>' + esc(g.name) + '</h3>' +
        '<div class="dlc-row">' + (hasDlc(g) ? '<span class="dlc-badge">DLC</span>' : '') + '</div>' +
        '<div class="meta">' + esc(g.titleID || 'No title ID') + (g.version ? ' · ' + esc(g.version) : '') + '</div>' +
        '<div class="tags">' + cardGenres(g).map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</div>' +
        '</button>';
    }).join('');
    $('msg').innerHTML = out.length ? '' : '<div class="empty">No games match your search.</div>';
  }

  function openGame(i) {
    var g = games[i];
    var dlc = dlcNames(g);
    var body = dlc.length
      ? '<h4>DLC (' + dlc.length + ')</h4><ul class="dlc-list">' +
        dlc.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>'
      : '<p>' + esc(g.description || g.description_short || 'No description available.') + '</p>';
    $('modal').innerHTML =
      '<img src="' + esc(g.image_url_medium) + '" alt="">' +
      '<div><h2>' + esc(g.name) + '</h2>' +
      '<div class="meta">' + esc(g.titleID || 'No title ID') + (g.version ? ' · ' + esc(g.version) : '') + '</div>' +
      '<div class="tags">' + (g.genres || []).map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</div>' +
      body + '</div>';
    $('dlg').showModal();
  }

  buildSortBox();
  $('q').addEventListener('input', render);
  $('sort').addEventListener('change', render);
  $('chips').addEventListener('click', toggleGenre);
  $('quick').addEventListener('click', function (e) {
    if (e.target.dataset.g) toggleGenre(e);
    else if (e.target.dataset.p) togglePlatform(e.target.dataset.p);
  });
  $('grid').addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (c) openGame(+c.dataset.i);
  });
  $('closeBtn').addEventListener('click', function () { $('dlg').close(); });
  $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) $('dlg').close(); });
  function isDark() {
    var t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function updateThemeLabel() { $('theme').innerHTML = isDark() ? '🌙<span class="tl"> Dark</span>' : '☀️<span class="tl"> Light</span>'; }
  $('theme').addEventListener('click', function () {
    document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
    updateThemeLabel();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeLabel);
  updateThemeLabel();
  updateMore();

  fetch(DATA_FILE)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(init)
    .catch(function (err) {
      $('msg').innerHTML = '<div class="error">Couldn’t load ' + DATA_FILE + ' (' + esc(err.message) + ').<br>' +
        'Make sure it sits next to index.html, and view the page through GitHub Pages or a local server ' +
        '(browsers block loading it when you double-click the file).</div>';
    });
})();
</script>
</body>
</html>
